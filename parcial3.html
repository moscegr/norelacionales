                code: `# EJEMPLO 1: Código base para una App de Streamlit (app.py)\nimport streamlit as st\nimport pandas as pd\n\n# Configurar la página principal\nst.set_page_config(page_title="Mi Dashboard", layout="wide")\nst.title("📊 Panel de Control General")\n\n# Crear datos simulados para visualizar rápidamente\ndatos_demo = pd.DataFrame({"Productos": ["Coca Cola", "Gansito", "Rufles"], "Stock": [50, 15, 32]})\nst.bar_chart(datos_demo.set_index("Productos"))\n\n# --- EJEMPLO 2: Diseño de Paneles, Botones y Formularios ---\nst.divider() # Línea divisoria visual\n\ncol1, col2 = st.columns(2) # Crear 2 columnas para organizar la pantalla\n\nwith col1:\n    st.info("🏫 Panel de Registro CBTis 134")\n    nombre_alumno = st.text_input("Nombre del Alumno")\n    promedio = st.slider("Promedio Escolar", 0.0, 10.0, 8.0)\n    if st.button("Guardar Alumno", type="primary"):\n        # Aquí iría tu código de PyMongo: insert_one()\n        st.success(f"¡Alumno {nombre_alumno} guardado con éxito!")\n\nwith col2:\n    st.warning("🏪 Panel de Actualización OXXO")\n    producto_buscar = st.text_input("Buscar Producto a actualizar")\n    if st.button("Verificar Stock"):\n        # Aquí iría tu código de PyMongo: find_one()\n        st.write("Buscando en la base de datos de Atlas...")`,

        function copyCode(btn) {
            const code = btn.previousElementSibling.innerText;
            const temp = document.createElement('textarea');
            temp.value = code;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> <span>¡CÓDIGO COPIADO!</span>';
            btn.classList.replace('bg-emerald-600', 'bg-blue-600');
            setTimeout(() => { 
                btn.innerHTML = original; 
                btn.classList.replace('bg-blue-600', 'bg-emerald-600');
            }, 2000);
        }
